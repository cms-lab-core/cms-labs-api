      - application/json
      description: Получение кода авторизации по OpenID.
      parameters:
      - description: Код приложения клиента
        in: query
        name: client_id
        required: true
        type: string
      - description: Адрес переадресации клиента
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: 'Тип ответа. Возможные значения: [code]'
        enum:
        - code
        in: query
        name: response_type
        required: true
        type: string
      - description: 'Область доступа (значения, разделённые запятой). Возможные значения:
          [default, openid]'
        enum:
        - default
        - openid
        in: query
        name: scope
        required: true
        type: string
      - description: Путь, возвращается в параметрах редиректа
        in: query
        name: path
        type: string
      - description: Состояние, возвращается в параметрах редиректа, участвует в генерации
          кода авторизации
        in: query
        name: state
        type: string
      - description: Дополнительные параметры вида base64
        in: query
        name: extra
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SSOAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.SSOError'
      security:
      - ApiKeyAuth: []
      summary: Получение кода авторизации по OpenID.
      tags:
      - SSO

# The health endpoint is independent of host development processes so the
# gateway Pod can become Ready before Vite is started.
location = /__dev_gateway/healthz {
    access_log off;
    return 204;
}

# Vite and its HMR WebSocket run directly from the working tree on the host.
location / {
    proxy_pass http://host.docker.internal:5183;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

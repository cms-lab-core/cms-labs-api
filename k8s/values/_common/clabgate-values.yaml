services:
  clabgate:
    ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: http

serviceAccount:
  clabgate:
    clusterRole:
      name: clabgate
      rules:
        - apiGroups: [ "c9s.run" ]
          resources: [ "topologies" ]
          verbs: [ "get", "list", "create", "update", "patch", "delete" ]
        - apiGroups: [ "apps" ]
          resources: [ "deployments" ]
          verbs: [ "get", "list", "create", "update", "patch", "delete" ]
        - apiGroups: [ "" ]
          resources: [ "namespaces", "pods", "pods/exec", "services", "persistentvolumeclaims", "configmaps" ]
          verbs: [ "get", "list", "create", "update", "patch", "delete" ]
        - apiGroups: [ "" ]
          resources: [ "pods/log" ]
          verbs: [ "get" ]
        - apiGroups: [ "batch" ]
          resources: [ "jobs" ]
          verbs: [ "get", "list", "create", "update", "patch", "delete" ]
        - apiGroups: [ "coordination.k8s.io" ]
          resources: [ "leases" ]
          verbs: [ "get", "list", "watch", "create", "update", "patch" ]

deployments:
  clabgate:
    serviceAccountName: clabgate
    replicas: 2
    initContainers:
      - name: vault-init
        image: harbor.k8s.cmslabs.ru/svc_cms_labs/images/vault-inject
        imageTag: latest
        command: [ "bash", "-c" ]
        args:
          - |
            fetch_secrets --path=clabgate --output=/var/run/secrets/app --formats=env
    containers:
      - name: clabgate
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: CHECKER_IMAGE
            value: ghcr.io/maintainer64/cms-labs-checker:1.0.1
          - name: JUPYTER_IMAGE
            value: ghcr.io/maintainer64/cms-labs-jupyter:1.0.0
        ports:
          - name: http
            containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "250Mi"
            cpu: "200m"
        startupProbe:
          httpGet:
            path: /clabgate/api/docs/index.html
            port: http
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /clabgate/api/docs/index.html
            port: http
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /clabgate/api/docs/index.html
            port: http
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 2
